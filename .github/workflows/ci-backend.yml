name: Backend CI

on:
  pull_request:
    branches: [ develop ]
    paths: [ 'backend/**' ]
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run lint --if-present
