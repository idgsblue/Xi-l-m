name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Notificar inicio
        run: echo " Iniciando deploy del backend..."
      
      - name:  Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name:  Actualizar código en VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}
            echo " Ubicación actual: $(pwd)"
            
            echo " Actualizando código desde GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git pull origin main
            
            echo " Código actualizado"
          EOF
      
      - name:  Reconstruir y reiniciar contenedor
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}
            
            echo " Reconstruyendo imagen Docker..."
            docker-compose build backend
            
            echo " Reiniciando contenedor..."
            docker-compose up -d backend
            
            echo " Esperando que el servicio inicie..."
            sleep 5
            
            echo " Estado de contenedores:"
            docker-compose ps
          EOF
      
      - name:  Verificar deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}
            
            if docker-compose ps | grep -q "booking-backend.*Up"; then
              echo " Backend desplegado exitosamente"
              docker-compose logs --tail=20 backend
            else
              echo " Error: El contenedor no está corriendo"
              docker-compose logs --tail=50 backend
              exit 1
            fi
          EOF
      
      - name: 🧹 Limpiar
        if: always()
        run: rm -f ~/.ssh/deploy_key
